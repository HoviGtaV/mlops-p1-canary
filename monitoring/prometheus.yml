global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: router
    static_configs: [{targets: ["router:8000"]}]
  - job_name: variants
    static_configs: [{targets: ["variant-a:8080", "variant-b:8080"]}]
  - job_name: controller
    static_configs: [{targets: ["controller:8090"]}]
  - job_name: simulator
    static_configs: [{targets: ["simulator:8001"]}]
