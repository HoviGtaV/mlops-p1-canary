name: p1-canary

x-app: &app
  image: p1-app:latest
  build: .
  environment: &app-env
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATA_DIR: /data
    SEED: "42"
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  mlflow:
    <<: *app
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*"
    volumes:
      - mlflow-data:/mlflow
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  trainer:
    <<: *app
    command: python -m p1.train
    environment:
      <<: *app-env
      FORCE_RETRAIN: ${FORCE_RETRAIN:-0}
    restart: "no"
    depends_on:
      mlflow: {condition: service_healthy}

  variant-a:
    <<: *app
    command: >
      sh -c "rm -rf /tmp/prom && mkdir -p /tmp/prom &&
      exec uvicorn p1.model_service:app --host 0.0.0.0 --port 8080 --workers 8 --loop uvloop --http httptools --log-level warning"
    environment:
      <<: *app-env
      VARIANT: a
      MODEL_ALIAS: champion
      OMP_NUM_THREADS: "1"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      BASE_ERROR_RATE: ${BASE_ERROR_RATE:-0.002}
    depends_on:
      trainer: {condition: service_completed_successfully}

  variant-b:
    <<: *app
    command: >
      sh -c "rm -rf /tmp/prom && mkdir -p /tmp/prom &&
      exec uvicorn p1.model_service:app --host 0.0.0.0 --port 8080 --workers 8 --loop uvloop --http httptools --log-level warning"
    environment:
      <<: *app-env
      VARIANT: b
      MODEL_ALIAS: challenger
      OMP_NUM_THREADS: "1"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      BASE_ERROR_RATE: ${BASE_ERROR_RATE:-0.002}
      # Injected failures (set by scripts/scenario.ps1)
      EXTRA_LATENCY_MS: ${B_EXTRA_LATENCY_MS:-0}
      ERROR_RATE: ${B_ERROR_RATE:-0}
      SCHEMA_BUG: ${B_SCHEMA_BUG:-0}
    depends_on:
      trainer: {condition: service_completed_successfully}

  router:
    <<: *app
    command: uvicorn p1.router:app --host 0.0.0.0 --port 8000 --loop uvloop --http httptools --log-level warning
    environment:
      <<: *app-env
      INITIAL_WEIGHT: "0"
    ports: ["8000:8000"]
    depends_on: [variant-a, variant-b]

  simulator:
    <<: *app
    command: python -m p1.simulator
    environment:
      <<: *app-env
      RATE: ${SIM_RATE:-150}
    depends_on: [router]

  controller:
    <<: *app
    command: uvicorn p1.controller:app --host 0.0.0.0 --port 8090 --log-level warning
    environment:
      <<: *app-env
      PROMETHEUS_URL: http://prometheus:9090
      ROUTER_URL: http://router:8000
    ports: ["8090:8090"]
    depends_on: [router, prometheus]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/canary.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
